name: Lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    runs-on: blacksmith-2vcpu-ubuntu-2404

    permissions:
      contents: read
      checks: write

    steps:
      - uses: useblacksmith/checkout@v1.8.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          components: clippy

      - name: Install just, cargo-hack
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: just,cargo-hack

      - name: Check with Clippy
        run: just clippy

  format:
    runs-on: ubuntu-slim
    steps:
      - name: Set user for Nix installer
        run: echo "USER=$(id -un)" >> "$GITHUB_ENV"

      - uses: useblacksmith/checkout@v1.8.2
        with:
          persist-credentials: false

      - name: Install Rust (nightly)
        id: rust
        background: true
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: nightly
          components: rustfmt

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Enter Nix devshell
        id: devshell
        background: true
        uses: nicknovitski/nix-develop@v1.2.1
        with:
          arguments: .#ci-format

      - name: Wait for Rust
        wait: rust

      - name: Wait for Nix devshell
        wait: devshell

      - name: Format project
        run: just fmt

      - name: Check formatting diff
        run: git diff --exit-code

  docs:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1.8.2
        with:
          persist-credentials: false

      - name: Install Rust (nightly)
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: nightly
          components: rust-docs

      - name: Check for broken intra-doc links
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features

  zizmor:
    name: GitHub Actions Security
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check GitHub Actions security
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          advanced-security: false
          annotations: true
